name = "secret_creatures"
title = "Secret Creatures"
summary = "Unlock every secret creature (Gorilla, Horse, Leopard, Mandrill + the hidden Rhino)."
doc = "docs/secret_creatures.md"

# The disc-edition unlockers write TimerValue/TimerCheckSum tied to the Windows product
# key, which can't be read on modern Windows, so they no longer work. Instead, rewrite
# SecretCreature::IsCreaturePresent(int) to unconditionally return true:
#   mov eax, 1   ; B8 01 00 00 00
#   retn         ; C3
# `expect` is the original prologue (mov eax, [esp+4]; mov ecx, [..]; bw1-decomp 0927).
[[op]]
kind = "replace"
offset = 0x311D90
expect = "8B 44 24 04 8B 0C"
bytes  = "B8 01 00 00 00 C3"
note   = "SecretCreature::IsCreaturePresent -> return true"
