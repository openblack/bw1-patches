[package]
name = "bw1patch"
version = "1.0.0"
edition = "2021"
description = "Apply the openblack Black & White 1 binary patches to an unprotected game executable."
repository = "https://github.com/openblack/bw1-patches"
license = "MIT"

[[bin]]
name = "bw1patch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
include_dir = "0.7"

# Icon injection (the `icon` subcommand) uses the Win32 resource-update APIs, so the
# dependency — and that code path — is Windows-only. Byte patching stays cross-platform.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader", "Win32_Foundation"] }

[profile.release]
strip = true
